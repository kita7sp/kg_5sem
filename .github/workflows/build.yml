name: Build Windows EXE for Laba3

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies and UPX
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          choco install upx

      - name: Build EXE with UPX Compression
        working-directory: ./лаба3
        run: |
          pyinstaller --onefile --noconsole laba3.py
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laba3-windows
          path: лаба3/dist/laba3.exe
